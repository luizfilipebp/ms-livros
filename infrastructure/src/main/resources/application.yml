spring:
  application:
    name: ms-livros

  flyway:
    locations: classpath:migration


  datasource:
      url: jdbc:postgresql://localhost:5432/livros
      username: root
      password: root
      driver-class-name: org.postgresql.Driver

  jpa:
      show-sql: true
      hibernate:
          naming:
              physical-strategy: org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl